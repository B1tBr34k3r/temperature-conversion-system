# ==============================================================================
# RENDER CLOUD BLUEPRINT SPECIFICATION
# Milestone 5: Cloud Deployment Automation
# ==============================================================================

services:
  - type: web
    name: temperature-conversion-system
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: sqlite-storage
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
